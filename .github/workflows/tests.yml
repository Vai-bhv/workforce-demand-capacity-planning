name: Workforce tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lightweight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - &install
        name: Install supported dependencies
        run: python -m pip install -r requirements-app.txt -r requirements-backtest.txt
      - name: Run tests that do not fit estimators
        env:
          PYTHONPATH: tests
        run: >-
          python -B -m unittest -v
          test_prepare_data test_planner
          test_backtest.OriginTests test_backtest.MetricTests
          test_staffing_replay.ScheduleTests test_staffing_replay.EpisodeTests

  full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - *python
      - *install
      - name: Run all tests including source-only benchmark and replay
        run: python -B -m unittest discover -s tests -v
